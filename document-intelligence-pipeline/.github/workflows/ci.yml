name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmupdf-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample PDFs
        run: python samples/create_samples.py

      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/evaluation

      - name: Run evaluation
        run: python tests/evaluation/run_evaluation.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Keep local and CI lint behavior reproducible instead of inheriting
      # breaking default-rule changes from the newest Ruff release.
      - run: pip install ruff==0.12.10
      - name: Lint with ruff
        run: ruff check src/ api/ dashboard/ tests/ --ignore E501

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t doc-intel-api .
      - name: Build Worker image
        run: docker build -f Dockerfile.worker -t doc-intel-worker .
      - name: Build Dashboard image
        run: docker build -f Dockerfile.dashboard -t doc-intel-dashboard .
