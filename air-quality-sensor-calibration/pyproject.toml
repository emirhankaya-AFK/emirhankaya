[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-sensor-calibration"
version = "0.1.0"
description = "Drift-aware calibration of low-cost air-quality sensors"
requires-python = ">=3.11"
dependencies = ["joblib>=1.3", "matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

