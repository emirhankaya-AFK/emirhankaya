[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-bearing-fault-diagnosis"
version = "0.1.0"
description = "Leakage-aware bearing fault classification on the CWRU vibration dataset."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Emirhan Kaya" }]
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "PyWavelets>=1.7",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[project.optional-dependencies]
cnn = ["torch>=2.5"]
dev = ["pytest>=8.3", "ruff==0.12.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
